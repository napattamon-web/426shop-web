<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>426 SHOP</title>

  <style>
    :root{
      --main:#8b5cf6;
      --main2:#a855f7;
      --pink:#ec4899;
      --bg:#fbf7ff;
      --card:#ffffff;
      --text:#241735;
      --muted:#8b7b9b;
      --line:#eadcff;
      --shadow:0 16px 40px rgba(96, 55, 160, .14);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Prompt,Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(236,72,153,.16), transparent 32%),
        radial-gradient(circle at top right, rgba(139,92,246,.22), transparent 34%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .app{
      max-width:560px;
      margin:0 auto;
      padding:14px 14px 110px;
    }

    .top{
      position:sticky;
      top:0;
      z-index:20;
      padding:10px 0 12px;
      background:linear-gradient(to bottom, rgba(251,247,255,.96), rgba(251,247,255,.82), transparent);
      backdrop-filter:blur(14px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--main),var(--pink));
      box-shadow:0 10px 26px rgba(139,92,246,.26);
      overflow:hidden;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:900;
      letter-spacing:.5px;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .brand h1{
      margin:0;
      font-size:21px;
      line-height:1.1;
      font-weight:900;
    }

    .brand p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .searchBox{
      display:flex;
      gap:8px;
      align-items:center;
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      box-shadow:0 10px 26px rgba(139,92,246,.10);
      border-radius:20px;
      padding:10px 12px;
    }

    .searchBox input{
      border:0;
      outline:0;
      flex:1;
      min-width:0;
      font-size:15px;
      background:transparent;
      color:var(--text);
    }

    .searchBox button{
      border:0;
      border-radius:14px;
      padding:9px 13px;
      background:linear-gradient(135deg,var(--main),var(--main2));
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .catsWrap{
      margin:12px -14px 0;
      overflow:auto;
      scrollbar-width:none;
      padding:2px 14px 10px;
    }

    .catsWrap::-webkit-scrollbar{
      display:none;
    }

    .cats{
      display:flex;
      gap:9px;
      width:max-content;
    }

    .cat{
      border:1px solid var(--line);
      background:rgba(255,255,255,.9);
      color:#6b4b8d;
      border-radius:999px;
      padding:9px 15px;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(139,92,246,.08);
      white-space:nowrap;
    }

    .cat.active{
      border-color:transparent;
      background:linear-gradient(135deg,var(--main),var(--pink));
      color:white;
      box-shadow:0 12px 26px rgba(139,92,246,.22);
    }

    .count{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:10px 2px 12px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
    }

    .card{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(234,220,255,.9);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      min-width:0;
      transform:translateY(0);
      transition:.18s ease;
    }

    .card:active{
      transform:scale(.985);
    }

    .pic{
      width:100%;
      aspect-ratio:1/1;
      background:linear-gradient(135deg,#f7edff,#fff);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .pic img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .noImg{
      color:#b59bd6;
      font-weight:900;
      font-size:13px;
    }

    .info{
      padding:11px;
    }

    .name{
      font-size:14px;
      font-weight:900;
      line-height:1.28;
      min-height:36px;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:9px;
    }

    .price{
      font-size:16px;
      color:var(--main);
      font-weight:950;
    }

    .stock{
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .choose{
      width:100%;
      margin-top:10px;
      border:0;
      border-radius:16px;
      padding:10px 8px;
      color:white;
      font-weight:900;
      background:linear-gradient(135deg,var(--main),var(--pink));
      cursor:pointer;
      box-shadow:0 10px 24px rgba(139,92,246,.20);
    }

    .loading,
    .empty{
      padding:26px 12px;
      text-align:center;
      color:var(--muted);
      font-weight:800;
    }

    .drawerMask{
      position:fixed;
      inset:0;
      z-index:60;
      background:rgba(35,20,55,.35);
      display:none;
      align-items:flex-end;
    }

    .drawerMask.show{
      display:flex;
    }

    .drawer{
      width:100%;
      max-width:560px;
      margin:0 auto;
      background:#fff;
      border-radius:28px 28px 0 0;
      padding:16px;
      box-shadow:0 -20px 50px rgba(45,24,75,.25);
      max-height:88vh;
      overflow:auto;
    }

    .drawerHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .drawerHead h2{
      margin:0;
      font-size:18px;
      font-weight:950;
    }

    .x{
      width:38px;
      height:38px;
      border:0;
      border-radius:14px;
      background:#f6efff;
      color:#6d46a0;
      font-size:22px;
      font-weight:900;
      cursor:pointer;
    }

    .detailPic{
      width:100%;
      aspect-ratio:1/1;
      border-radius:22px;
      background:linear-gradient(135deg,#f7edff,#fff);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:1px solid var(--line);
    }

    .detailPic img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .detailName{
      margin:14px 2px 6px;
      font-size:20px;
      font-weight:950;
      line-height:1.25;
    }

    .detailDesc{
      margin:0 2px 10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
      white-space:pre-wrap;
    }

    .optionBox{
      display:grid;
      gap:8px;
      margin:12px 0;
    }

    .option{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:11px 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      font-weight:850;
    }

    .option.active{
      border-color:var(--main);
      background:#f5efff;
      color:#6d28d9;
    }

    .qtyRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      border-radius:18px;
      background:#fbf7ff;
      border:1px solid var(--line);
      margin:12px 0;
    }

    .qtyBtns{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .qtyBtns button{
      width:34px;
      height:34px;
      border:0;
      border-radius:12px;
      background:#efe3ff;
      color:#6d28d9;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
    }

    .qtyBtns span{
      min-width:28px;
      text-align:center;
      font-weight:950;
      font-size:17px;
    }

    .summary{
      background:linear-gradient(135deg,#faf5ff,#fff);
      border:1px solid var(--line);
      border-radius:20px;
      padding:13px;
      margin:12px 0;
      line-height:1.65;
      font-size:14px;
      color:#4c3565;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .btn{
      border:0;
      border-radius:18px;
      padding:13px 10px;
      font-weight:950;
      cursor:pointer;
      font-size:14px;
    }

    .btnMain{
      background:linear-gradient(135deg,var(--main),var(--pink));
      color:#fff;
      box-shadow:0 12px 30px rgba(139,92,246,.24);
    }

    .btnSoft{
      background:#f4ecff;
      color:#6d28d9;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%) translateY(30px);
      z-index:100;
      background:#2b1740;
      color:white;
      padding:12px 15px;
      border-radius:999px;
      font-size:14px;
      font-weight:850;
      box-shadow:0 16px 40px rgba(0,0,0,.22);
      opacity:0;
      pointer-events:none;
      transition:.22s ease;
      max-width:92vw;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media (max-width:360px){
      .app{
        padding-left:10px;
        padding-right:10px;
      }

      .grid{
        gap:10px;
      }

      .name{
        font-size:13px;
      }

      .price{
        font-size:15px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo" id="logoBox">426</div>
        <div>
          <h1 id="shopName">426 SHOP</h1>
          <p>เลือกสินค้าได้ง่าย รวดเร็ว พร้อมสั่งซื้อ</p>
        </div>
      </div>

      <div class="searchBox">
        <input id="searchInput" type="search" placeholder="ค้นหาสินค้า" autocomplete="off" />
        <button id="searchBtn" type="button">ค้นหา</button>
      </div>

      <div class="catsWrap">
        <div class="cats" id="cats"></div>
      </div>
    </div>

    <div class="count">
      <span id="countText">กำลังโหลดสินค้า...</span>
      <span id="activeCatText"></span>
    </div>

    <div id="list" class="grid"></div>
    <div id="state" class="loading">กำลังโหลด...</div>
  </div>

  <div id="drawerMask" class="drawerMask">
    <div class="drawer">
      <div class="drawerHead">
        <h2>รายละเอียดสินค้า</h2>
        <button class="x" type="button" onclick="closeDrawer()">×</button>
      </div>

      <div id="drawerBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbztTN5lqIKWg0AH4WrTjepTAyHGmwihefg8_rdu0t6RSgYc049wVhhgkm6wF162kcOl/exec';

    const $ = id => document.getElementById(id);

    let PRODUCTS = [];
    let CATEGORIES = [];
    let ACTIVE_CAT = 'ทั้งหมด';
    let CURRENT = null;
    let CURRENT_OPTION = '';
    let QTY = 1;

    function api(name, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = 'cb426_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
        const url = new URL(GAS_URL);

        url.searchParams.set('webapi', name);
        url.searchParams.set('callback', cb);

        Object.keys(params).forEach(k => {
          url.searchParams.set(k, params[k]);
        });

        const s = document.createElement('script');

        window[cb] = data => {
          resolve(data);
          cleanup();
        };

        s.onerror = () => {
          reject(new Error('เชื่อมต่อไม่สำเร็จ'));
          cleanup();
        };

        function cleanup() {
          try { delete window[cb]; } catch(e) {}
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }

        s.src = url.toString();
        document.body.appendChild(s);
      });
    }

    function money(n) {
      n = Number(n || 0);
      return n.toLocaleString('th-TH') + ' บาท';
    }

    function safe(v) {
      return String(v == null ? '' : v)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function showToast(text) {
      const t = $('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    async function init() {
      try {
        const cfg = await api('config');

        if (cfg && cfg.ok) {
          $('shopName').textContent = cfg.shopName || '426 SHOP';

          if (cfg.logoUrl) {
            $('logoBox').innerHTML = '<img src="' + safe(cfg.logoUrl) + '" alt="">';
          }
        }

        await loadProducts();
      } catch (err) {
        $('state').className = 'empty';
        $('state').textContent = 'โหลดข้อมูลไม่สำเร็จ';
      }
    }

    async function loadProducts() {
      $('state').className = 'loading';
      $('state').style.display = 'block';
      $('state').textContent = 'กำลังโหลด...';

      const q = $('searchInput').value.trim();

      const res = await api('products', {
        q: q,
        category: ACTIVE_CAT === 'ทั้งหมด' ? '' : ACTIVE_CAT
      });

      if (!res.ok) {
        $('list').innerHTML = '';
        $('state').className = 'empty';
        $('state').textContent = res.message || 'ไม่พบข้อมูล';
        $('countText').textContent = 'ไม่มีสินค้า';
        return;
      }

      PRODUCTS = res.items || [];
      CATEGORIES = res.categories || [];

      renderCats();
      renderProducts();

      $('countText').textContent = 'มีสินค้า ' + PRODUCTS.length + ' รายการ';
      $('activeCatText').textContent = ACTIVE_CAT === 'ทั้งหมด' ? '' : ACTIVE_CAT;

      if (!PRODUCTS.length) {
        $('state').className = 'empty';
        $('state').style.display = 'block';
        $('state').textContent = 'ไม่พบสินค้า';
      } else {
        $('state').style.display = 'none';
      }
    }

    function renderCats() {
      const all = ['ทั้งหมด'].concat(CATEGORIES);
      $('cats').innerHTML = all.map(c => {
        return '<button type="button" class="cat ' + (c === ACTIVE_CAT ? 'active' : '') + '" onclick="setCat(\'' + encodeURIComponent(c) + '\')">' + safe(c) + '</button>';
      }).join('');
    }

    function setCat(c) {
      ACTIVE_CAT = decodeURIComponent(c);
      loadProducts();
    }

    function renderProducts() {
      $('list').innerHTML = PRODUCTS.map(item => {
        const img = item.image
          ? '<img loading="lazy" src="' + safe(item.image) + '" alt="">'
          : '<div class="noImg">426 SHOP</div>';

        const stock = item.stock === '' || item.stock == null
          ? ''
          : '<span class="stock">คงเหลือ ' + safe(item.stock) + '</span>';

        return `
          <div class="card">
            <div class="pic">${img}</div>
            <div class="info">
              <div class="name">${safe(item.name)}</div>
              <div class="meta">
                <div class="price">${money(item.price)}</div>
                ${stock}
              </div>
              <button class="choose" type="button" onclick="openProduct('${safe(item.id)}')">เลือกสินค้า</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function openProduct(id) {
      try {
        const res = await api('product', { id });

        if (!res.ok) {
          showToast(res.message || 'ไม่พบสินค้า');
          return;
        }

        CURRENT = res.item;
        CURRENT_OPTION = '';
        QTY = 1;

        const img = CURRENT.image
          ? '<img src="' + safe(CURRENT.image) + '" alt="">'
          : '<div class="noImg">426 SHOP</div>';

        let options = '';

        if (CURRENT.options && CURRENT.options.length) {
          options = `
            <div class="optionBox">
              ${CURRENT.options.map((o, i) => `
                <div class="option ${i === 0 ? 'active' : ''}" onclick="selectOption('${safe(o.name)}', this)">
                  <span>${safe(o.name)}</span>
                  <span>${money(o.price || CURRENT.price)}</span>
                </div>
              `).join('')}
            </div>
          `;

          CURRENT_OPTION = CURRENT.options[0].name || '';
        }

        $('drawerBody').innerHTML = `
          <div class="detailPic">${img}</div>
          <div class="detailName">${safe(CURRENT.name)}</div>
          ${CURRENT.description ? '<div class="detailDesc">' + safe(CURRENT.description) + '</div>' : ''}
          ${options}

          <div class="qtyRow">
            <b>จำนวน</b>
            <div class="qtyBtns">
              <button type="button" onclick="changeQty(-1)">−</button>
              <span id="qtyText">1</span>
              <button type="button" onclick="changeQty(1)">+</button>
            </div>
          </div>

          <div class="summary" id="summaryBox"></div>

          <div class="actions">
            <button class="btn btnSoft" type="button" onclick="copyCurrent()">คัดลอก</button>
            <button class="btn btnMain" type="button" onclick="createOrder()">สั่งซื้อ</button>
          </div>
        `;

        updateSummary();
        $('drawerMask').classList.add('show');
      } catch (err) {
        showToast('เปิดสินค้าไม่สำเร็จ');
      }
    }

    function closeDrawer() {
      $('drawerMask').classList.remove('show');
    }

    function selectOption(name, el) {
      CURRENT_OPTION = name;

      document.querySelectorAll('.option').forEach(x => x.classList.remove('active'));
      el.classList.add('active');

      updateSummary();
    }

    function changeQty(n) {
      QTY = Math.max(1, QTY + n);
      $('qtyText').textContent = QTY;
      updateSummary();
    }

    function currentPrice() {
      let price = Number(CURRENT.price || 0);

      if (CURRENT_OPTION && CURRENT.options && CURRENT.options.length) {
        const opt = CURRENT.options.find(o => String(o.name) === String(CURRENT_OPTION));
        if (opt && Number(opt.price) > 0) price = Number(opt.price);
      }

      return price;
    }

    function orderText(orderNo = '') {
      const price = currentPrice();
      const total = price * QTY;

      return [
        orderNo ? 'เลขออเดอร์: ' + orderNo : '',
        'สินค้า: ' + CURRENT.name,
        CURRENT_OPTION ? 'ตัวเลือก: ' + CURRENT_OPTION : '',
        'จำนวน: ' + QTY,
        'ราคา: ' + money(price),
        'รวม: ' + money(total)
      ].filter(Boolean).join('\n');
    }

    function updateSummary() {
      if (!CURRENT) return;

      $('summaryBox').innerHTML = orderText()
        .split('\n')
        .map(x => safe(x))
        .join('<br>');
    }

    async function copyCurrent() {
      if (!CURRENT) return;

      const text = orderText();

      try {
        await navigator.clipboard.writeText(text);
        showToast('คัดลอกแล้ว');
      } catch (err) {
        showToast('คัดลอกไม่สำเร็จ');
      }
    }

    async function createOrder() {
      if (!CURRENT) return;

      const payload = {
        productId: CURRENT.id,
        productName: CURRENT.name,
        optionName: CURRENT_OPTION,
        qty: QTY,
        price: currentPrice(),
        note: ''
      };

      try {
        showToast('กำลังบันทึกออเดอร์...');

        const res = await api('createOrder', {
          payload: encodeURIComponent(JSON.stringify(payload))
        });

        if (!res.ok) {
          showToast(res.message || 'สร้างออเดอร์ไม่สำเร็จ');
          return;
        }

        const text = orderText(res.orderNo);

        $('summaryBox').innerHTML = text
          .split('\n')
          .map(x => safe(x))
          .join('<br>');

        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {}

        showToast('สร้างออเดอร์แล้ว');
      } catch (err) {
        showToast('สร้างออเดอร์ไม่สำเร็จ');
      }
    }

    $('searchBtn').addEventListener('click', loadProducts);

    $('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadProducts();
    });

    $('searchInput').addEventListener('input', debounce(() => {
      loadProducts();
    }, 380));

    $('drawerMask').addEventListener('click', e => {
      if (e.target.id === 'drawerMask') closeDrawer();
    });

    function debounce(fn, wait) {
      let t;
      return function() {
        clearTimeout(t);
        t = setTimeout(fn, wait);
      };
    }

    init();
  </script>
</body>
</html>
