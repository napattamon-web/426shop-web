<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>426 SHOP</title>

  <style>
    :root{
      --bg:#f6f4ef;
      --surface:#ffffff;
      --surface2:#f9f7f2;
      --black:#111111;
      --text:#1f1f1f;
      --muted:#77736b;
      --line:#e6e0d7;
      --gold:#b98b3f;
      --gold2:#d8b36b;
      --danger:#c94b4b;
      --success:#2f8b57;
      --radius:24px;
      --shadow:0 18px 50px rgba(20,20,20,.10);
      --shadow2:0 8px 24px rgba(20,20,20,.08);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% -8%,rgba(216,179,107,.28),transparent 30%),
        radial-gradient(circle at 90% 8%,rgba(17,17,17,.08),transparent 28%),
        linear-gradient(180deg,#fbfaf7 0%,var(--bg) 48%,#efe9de 100%);
      overflow-x:hidden;
    }

    button,input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      transition:.18s ease;
    }

    button:active{
      transform:scale(.97);
    }

    .app{
      width:100%;
      max-width:560px;
      margin:0 auto;
      min-height:100vh;
      padding:14px 14px 112px;
    }

    .top{
      position:sticky;
      top:0;
      z-index:30;
      padding:8px 0 12px;
      background:linear-gradient(180deg,rgba(246,244,239,.94),rgba(246,244,239,.76));
      backdrop-filter:blur(20px);
    }

    .brandBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logoMark{
      width:42px;
      height:42px;
      border-radius:15px;
      display:grid;
      place-items:center;
      color:#fff;
      background:linear-gradient(145deg,#111,#373737);
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      font-size:17px;
      font-weight:1000;
      letter-spacing:.3px;
    }

    .logoText b{
      display:block;
      color:var(--black);
      font-size:18px;
      line-height:1.1;
      letter-spacing:.2px;
    }

    .logoText span{
      display:block;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      margin-top:2px;
      letter-spacing:.4px;
      text-transform:uppercase;
    }

    .cartMini{
      min-width:82px;
      padding:11px 13px;
      border-radius:999px;
      color:#fff;
      background:var(--black);
      box-shadow:0 12px 26px rgba(0,0,0,.18);
      font-weight:1000;
      font-size:13px;
    }

    .cartMini span{
      display:inline-grid;
      place-items:center;
      min-width:23px;
      height:23px;
      margin-left:4px;
      padding:0 7px;
      border-radius:999px;
      color:var(--black);
      background:linear-gradient(135deg,var(--gold2),#fff0c8);
      font-size:12px;
    }

    .hero{
      position:relative;
      overflow:hidden;
      min-height:210px;
      padding:22px 18px;
      border-radius:32px;
      color:#fff;
      background:
        linear-gradient(135deg,rgba(17,17,17,.96),rgba(44,42,38,.96)),
        radial-gradient(circle at 85% 10%,rgba(216,179,107,.42),transparent 35%);
      box-shadow:var(--shadow);
    }

    .hero:before{
      content:"";
      position:absolute;
      width:190px;
      height:190px;
      right:-75px;
      top:-70px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(216,179,107,.50),rgba(216,179,107,0) 68%);
    }

    .hero:after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(180deg,rgba(255,255,255,.04) 1px,transparent 1px);
      background-size:28px 28px;
      opacity:.22;
      pointer-events:none;
    }

    .heroContent{
      position:relative;
      z-index:2;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      color:#fff1d0;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.16);
      font-size:12px;
      font-weight:900;
      backdrop-filter:blur(10px);
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--gold2);
      box-shadow:0 0 0 5px rgba(216,179,107,.16);
    }

    h1{
      margin:18px 0 0;
      font-size:34px;
      line-height:.95;
      letter-spacing:-.8px;
      color:#fff;
    }

    .hero p{
      width:80%;
      margin:12px 0 0;
      color:#d9d2c7;
      font-size:13px;
      line-height:1.6;
    }

    .heroActions{
      display:flex;
      gap:9px;
      margin-top:18px;
    }

    .heroBtn{
      padding:12px 15px;
      border-radius:999px;
      font-size:13px;
      font-weight:1000;
    }

    .heroBtn.primary{
      color:#111;
      background:linear-gradient(135deg,var(--gold2),#fff0c8);
    }

    .heroBtn.secondary{
      color:#fff;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
    }

    .metricRow{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      margin-top:12px;
    }

    .metric{
      padding:13px 10px;
      border-radius:22px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(230,224,215,.88);
      box-shadow:var(--shadow2);
      text-align:center;
    }

    .metric b{
      display:block;
      color:var(--black);
      font-size:16px;
      line-height:1.1;
    }

    .metric span{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
      font-weight:900;
    }

    .searchWrap{
      position:relative;
      margin-top:12px;
    }

    .searchWrap input{
      width:100%;
      height:52px;
      padding:0 46px 0 45px;
      border-radius:999px;
      border:1px solid var(--line);
      outline:none;
      color:var(--text);
      background:rgba(255,255,255,.92);
      box-shadow:0 10px 24px rgba(20,20,20,.06);
    }

    .searchWrap input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(185,139,63,.13);
    }

    .searchIcon{
      position:absolute;
      left:17px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      font-weight:1000;
    }

    .clearSearch{
      display:none;
      position:absolute;
      right:9px;
      top:50%;
      transform:translateY(-50%);
      width:34px;
      height:34px;
      border-radius:50%;
      color:var(--black);
      background:var(--surface2);
      font-size:19px;
      font-weight:1000;
    }

    .tabs{
      display:flex;
      gap:9px;
      overflow:auto;
      scrollbar-width:none;
      padding:11px 1px 3px;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      flex:0 0 auto;
      padding:10px 14px;
      border-radius:999px;
      color:var(--muted);
      background:rgba(255,255,255,.82);
      border:1px solid var(--line);
      font-size:13px;
      font-weight:1000;
      box-shadow:0 7px 16px rgba(20,20,20,.04);
    }

    .tab.active{
      color:#fff;
      background:var(--black);
      border-color:var(--black);
      box-shadow:0 10px 22px rgba(0,0,0,.15);
    }

    .sectionTitle{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin:16px 2px 11px;
    }

    .sectionTitle h2{
      margin:0;
      color:var(--black);
      font-size:20px;
      letter-spacing:-.2px;
    }

    .sectionTitle span{
      color:var(--muted);
      font-size:12px;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:13px;
    }

    .card{
      position:relative;
      overflow:hidden;
      padding:10px;
      border-radius:28px;
      background:rgba(255,255,255,.94);
      border:1px solid rgba(230,224,215,.9);
      box-shadow:var(--shadow2);
      animation:fadeUp .28s ease both;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .productImage{
      position:relative;
      height:156px;
      overflow:hidden;
      border-radius:23px;
      background:
        radial-gradient(circle at 30% 18%,#fff,transparent 36%),
        linear-gradient(145deg,#f8f5ef,#eee7dc);
      border:1px solid #eee7dc;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .productImage img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:7px;
      mix-blend-mode:multiply;
    }

    .tag{
      position:absolute;
      left:9px;
      top:9px;
      z-index:3;
      padding:6px 9px;
      border-radius:999px;
      color:#111;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(230,224,215,.9);
      backdrop-filter:blur(12px);
      font-size:10px;
      font-weight:1000;
    }

    .productName{
      margin-top:10px;
      min-height:39px;
      color:var(--black);
      text-align:center;
      font-size:14px;
      font-weight:1000;
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .productDesc{
      min-height:32px;
      margin-top:5px;
      color:var(--muted);
      text-align:center;
      font-size:11px;
      line-height:1.45;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .price{
      margin-top:9px;
      color:var(--black);
      text-align:center;
      font-size:17px;
      font-weight:1000;
      letter-spacing:-.2px;
    }

    .stock{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:6px;
      margin-top:7px;
      color:var(--muted);
      font-size:11px;
      font-weight:900;
    }

    .stock i{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--success);
    }

    .stock i.out{
      background:var(--danger);
    }

    .buy{
      width:100%;
      margin-top:10px;
      padding:12px 8px;
      border-radius:999px;
      color:#fff;
      background:var(--black);
      font-size:13px;
      font-weight:1000;
      box-shadow:0 11px 22px rgba(0,0,0,.14);
    }

    .buy:disabled{
      color:#948d82;
      background:#e7e1d8;
      box-shadow:none;
      cursor:not-allowed;
    }

    .bottomNav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:60;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:rgba(246,244,239,.78);
      backdrop-filter:blur(22px);
      border-top:1px solid rgba(230,224,215,.92);
    }

    .bottomInner{
      max-width:560px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr 1.35fr;
      gap:10px;
    }

    .navBtn{
      min-height:52px;
      border-radius:999px;
      font-weight:1000;
      font-size:14px;
    }

    .navBtn.light{
      color:var(--black);
      background:rgba(255,255,255,.9);
      border:1px solid var(--line);
      box-shadow:0 8px 20px rgba(20,20,20,.06);
    }

    .navBtn.dark{
      color:#fff;
      background:var(--black);
      box-shadow:0 14px 30px rgba(0,0,0,.18);
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:100;
      align-items:flex-end;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(6px);
    }

    .modal.show{
      display:flex;
    }

    .sheet{
      width:100%;
      max-width:560px;
      max-height:88vh;
      overflow:auto;
      margin:0 auto;
      padding:16px 16px calc(18px + env(safe-area-inset-bottom));
      border-radius:32px 32px 0 0;
      background:linear-gradient(180deg,#fff,#f8f5ef);
      box-shadow:0 -28px 70px rgba(0,0,0,.24);
      animation:sheetUp .22s ease both;
    }

    @keyframes sheetUp{
      from{
        opacity:.75;
        transform:translateY(28px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .handle{
      width:48px;
      height:5px;
      margin:0 auto 14px;
      border-radius:999px;
      background:#d7cec1;
    }

    .sheetHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }

    .sheetHead h2{
      margin:0;
      color:var(--black);
      font-size:21px;
      letter-spacing:-.3px;
    }

    .x{
      width:40px;
      height:40px;
      border-radius:50%;
      color:var(--black);
      background:#eee9df;
      font-size:23px;
      font-weight:1000;
    }

    .notice{
      margin:10px 0;
      padding:14px;
      border-radius:22px;
      color:#504a42;
      background:#f4efe6;
      border:1px solid #e7ddcf;
      font-size:13px;
      line-height:1.65;
    }

    .notice.good{
      color:#236342;
      background:#edf8f1;
      border-color:#cfebda;
    }

    .notice.warn{
      color:#8a5a17;
      background:#fff7e8;
      border-color:#ead5ad;
    }

    .row{
      margin:10px 0;
      padding:13px;
      border-radius:23px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 20px rgba(20,20,20,.05);
    }

    .rowTop{
      display:flex;
      justify-content:space-between;
      gap:12px;
    }

    .rowName{
      color:var(--black);
      font-size:14px;
      font-weight:1000;
      line-height:1.45;
    }

    .rowMeta{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .qty{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:11px;
    }

    .qty button{
      min-width:36px;
      height:36px;
      border-radius:999px;
      color:var(--black);
      background:#f4efe6;
      font-weight:1000;
    }

    .qty .remove{
      margin-left:auto;
      padding:0 14px;
      color:var(--danger);
      background:#fff0ee;
    }

    .total{
      margin:12px 0;
      padding:17px 14px;
      border-radius:25px;
      color:#111;
      background:
        linear-gradient(135deg,rgba(216,179,107,.28),rgba(255,255,255,.85)),
        #fff;
      border:1px solid #e8d8b7;
      text-align:center;
      font-size:24px;
      font-weight:1000;
      letter-spacing:-.4px;
    }

    .bigBtn{
      width:100%;
      min-height:50px;
      margin-top:9px;
      border-radius:999px;
      color:#fff;
      background:var(--black);
      font-weight:1000;
      box-shadow:0 12px 26px rgba(0,0,0,.16);
    }

    .bigBtn.gold{
      color:#111;
      background:linear-gradient(135deg,var(--gold2),#fff0c8);
    }

    .bigBtn.light{
      color:var(--black);
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 18px rgba(20,20,20,.05);
    }

    .bigBtn.danger{
      color:var(--danger);
      background:#fff;
      border:1px solid #efd3d3;
      box-shadow:none;
    }

    .bigBtn:disabled{
      color:#948d82;
      background:#e7e1d8;
      box-shadow:none;
    }

    .form input{
      width:100%;
      height:52px;
      margin-top:9px;
      padding:0 14px;
      border-radius:18px;
      border:1px solid var(--line);
      outline:none;
      background:#fff;
      color:var(--text);
    }

    .form input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(185,139,63,.13);
    }

    .codeBox{
      white-space:pre-wrap;
      word-break:break-word;
      margin-top:10px;
      padding:14px;
      border-radius:18px;
      color:#222;
      background:#f8f5ef;
      border:1px dashed #cbb890;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:13px;
      line-height:1.55;
    }

    .empty{
      grid-column:1/-1;
      padding:34px 18px;
      border-radius:28px;
      color:var(--muted);
      background:rgba(255,255,255,.86);
      border:1px solid var(--line);
      box-shadow:var(--shadow2);
      text-align:center;
      font-weight:900;
      line-height:1.6;
    }

    .loading{
      padding:32px 0;
      color:var(--muted);
      text-align:center;
      font-weight:1000;
    }

    .spinner{
      width:36px;
      height:36px;
      margin:0 auto 13px;
      border-radius:50%;
      border:4px solid #e9e1d6;
      border-top-color:var(--black);
      animation:spin .85s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:96px;
      z-index:999;
      max-width:86vw;
      padding:12px 16px;
      border-radius:999px;
      color:#fff;
      background:#111;
      box-shadow:0 14px 34px rgba(0,0,0,.25);
      text-align:center;
      font-size:13px;
      font-weight:1000;
      transform:translateX(-50%) translateY(12px);
      opacity:0;
      pointer-events:none;
      transition:.2s ease;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:370px){
      .app{
        padding-left:10px;
        padding-right:10px;
      }

      .grid{
        gap:10px;
      }

      .productImage{
        height:138px;
      }

      h1{
        font-size:30px;
      }

      .hero{
        padding:19px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brandBar">
        <div class="logo">
          <div class="logoMark">426</div>
          <div class="logoText">
            <b>426 SHOP</b>
            <span>Premium Digital Store</span>
          </div>
        </div>

        <button class="cartMini" onclick="openCart()">
          ตะกร้า <span id="cartCount">0</span>
        </button>
      </div>

      <section class="hero">
        <div class="heroContent">
          <div class="badge"><i class="dot"></i> Online Store พร้อมใช้งาน</div>
          <h1>เลือกสินค้า<br>รับทันทีบนเว็บ</h1>
          <p>ประสบการณ์สั่งซื้อแบบเรียบหรู รวดเร็ว และใช้งานง่ายเหมือนร้านแบรนด์ใหญ่</p>

          <div class="heroActions">
            <button class="heroBtn primary" onclick="scrollToProducts()">ดูสินค้า</button>
            <button class="heroBtn secondary" onclick="openReceive()">รับสินค้า</button>
          </div>
        </div>
      </section>

      <div class="metricRow">
        <div class="metric">
          <b id="statProducts">0</b>
          <span>สินค้า</span>
        </div>
        <div class="metric">
          <b id="statReady">0</b>
          <span>พร้อมขาย</span>
        </div>
        <div class="metric">
          <b>FAST</b>
          <span>ใช้งานไว</span>
        </div>
      </div>

      <div class="searchWrap">
        <span class="searchIcon">⌕</span>
        <input id="searchInput" placeholder="ค้นหาสินค้าที่ต้องการ" oninput="handleSearch()">
        <button class="clearSearch" id="clearSearch" onclick="clearSearch()">×</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="setFilter('all',this)">ทั้งหมด</button>
        <button class="tab" onclick="setFilter('ready',this)">พร้อมขาย</button>
        <button class="tab" onclick="setFilter('promo',this)">โปรโมชัน</button>
        <button class="tab" onclick="setFilter('option',this)">มีตัวเลือก</button>
      </div>
    </div>

    <div class="sectionTitle" id="productsSection">
      <h2>สินค้าแนะนำ</h2>
      <span id="resultCount">กำลังโหลด...</span>
    </div>

    <div id="productGrid" class="grid">
      <div class="empty">
        <div class="spinner"></div>
        กำลังโหลดสินค้า...
      </div>
    </div>
  </div>

  <div class="bottomNav">
    <div class="bottomInner">
      <button class="navBtn light" onclick="openReceive()">รับสินค้า</button>
      <button class="navBtn dark" onclick="openCart()">ชำระเงิน <span id="bottomCartText"></span></button>
    </div>
  </div>

  <div class="modal" id="modal" onclick="backdropClose(event)">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheetHead">
        <h2 id="modalTitle">ตะกร้า</h2>
        <button class="x" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  /************************************************************
   * ใส่ Web App URL ของ Apps Script ตรงนี้
   * ต้องลงท้ายด้วย /exec
   ************************************************************/
  const API_URL = 'https://script.google.com/macros/s/AKfycbztTN5lqIKWg0AH4WrTjepTAyHGmwihefg8_rdu0t6RSgYc049wVhhgkm6wF162kcOl/exec';

  let products = [];
  let cart = loadCart();
  let lastOrder = loadLastOrder();
  let currentFilter = 'all';
  let bankCache = {};

  const $ = id => document.getElementById(id);

  function normalizeApiUrl(){
    let url = String(API_URL || '').trim();

    if (!url || url.includes('ใส่ URL')) {
      throw new Error('ยังไม่ได้ใส่ API_URL ใน index.html');
    }

    return url.replace('/dev','/exec');
  }

  function api(action, params = {}){
    return new Promise((resolve, reject) => {
      let base;

      try{
        base = normalizeApiUrl();
      }catch(e){
        reject(e);
        return;
      }

      const callback = 'WEB426_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      const q = new URLSearchParams();

      q.set('action', action);
      q.set('callback', callback);
      q.set('_', Date.now());

      Object.keys(params || {}).forEach(k => {
        if (params[k] !== undefined && params[k] !== null) q.set(k, params[k]);
      });

      let done = false;
      let script = document.createElement('script');

      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();

        fetchApi(base, action, params)
          .then(resolve)
          .catch(() => reject(new Error('เชื่อมต่อ API ไม่สำเร็จ กรุณาตรวจสอบ URL Web App /exec และ doGet JSONP')));
      }, 9000);

      function cleanup(){
        clearTimeout(timer);
        try{ delete window[callback]; }catch(e){ window[callback] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[callback] = data => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data || {});
      };

      script.onerror = () => {
        if (done) return;
        done = true;
        cleanup();

        fetchApi(base, action, params)
          .then(resolve)
          .catch(() => reject(new Error('เชื่อมต่อ API ไม่สำเร็จ กรุณาตรวจสอบสิทธิ์ Deploy เป็น Anyone')));
      };

      script.src = base + '?' + q.toString();
      document.body.appendChild(script);
    });
  }

  async function fetchApi(base, action, params){
    const q = new URLSearchParams();
    q.set('action', action);
    q.set('_', Date.now());

    Object.keys(params || {}).forEach(k => {
      if (params[k] !== undefined && params[k] !== null) q.set(k, params[k]);
    });

    const res = await fetch(base + '?' + q.toString(), {
      method:'GET',
      cache:'no-store',
      redirect:'follow'
    });

    const text = await res.text();

    try{
      return JSON.parse(text);
    }catch(e){
      const m = text.match(/\(([\s\S]*)\)\s*;?\s*$/);
      if (m) return JSON.parse(m[1]);
      throw new Error('API ไม่ได้ส่งข้อมูล JSON');
    }
  }

  function money(n){
    n = Number(n || 0);
    return n.toLocaleString('th-TH',{maximumFractionDigits:2});
  }

  function loadCart(){
    try{return JSON.parse(localStorage.getItem('426_web_cart') || '[]')}
    catch(e){return []}
  }

  function saveCart(){
    localStorage.setItem('426_web_cart', JSON.stringify(cart));
    updateCartCount();
  }

  function loadLastOrder(){
    try{return JSON.parse(localStorage.getItem('426_web_last_order') || '{}')}
    catch(e){return {}}
  }

  function saveLastOrder(o){
    lastOrder = o || {};
    localStorage.setItem('426_web_last_order', JSON.stringify(lastOrder));
  }

  function sessionId(){
    let id = localStorage.getItem('426_web_session');

    if (!id){
      id = 'WEB-' + Date.now() + '-' + Math.floor(Math.random() * 1000000);
      localStorage.setItem('426_web_session', id);
    }

    return id;
  }

  function updateCartCount(){
    const count = cart.reduce((s,x) => s + Number(x.qty || 0), 0);
    $('cartCount').textContent = count;
    $('bottomCartText').textContent = count ? '(' + count + ')' : '';
  }

  async function loadCatalog(){
    updateCartCount();

    const cache = localStorage.getItem('426_web_catalog_cache');

    if (cache){
      try{
        const c = JSON.parse(cache);

        if (Date.now() - c.t < 120000){
          products = Array.isArray(c.products) ? c.products : [];
          bankCache = c.bank || {};
          updateStats();
          renderProducts();
        }
      }catch(e){}
    }

    try{
      const res = await api('catalog');

      if (!res || res.ok === false){
        throw new Error((res && res.message) || 'โหลดสินค้าไม่สำเร็จ');
      }

      products = normalizeProducts(res.products || res.items || res.data || []);
      bankCache = res.bank || res.payment || {};

      localStorage.setItem('426_web_catalog_cache', JSON.stringify({
        t:Date.now(),
        products,
        bank:bankCache
      }));

      updateStats();
      renderProducts();

    }catch(e){
      if (!products.length){
        $('productGrid').innerHTML = `
          <div class="empty">
            ${escapeHtml(e.message)}<br><br>
            ตรวจสอบว่า Web App เป็นลิงก์ /exec และ Deploy เป็น Anyone
          </div>
        `;
        $('resultCount').textContent = 'โหลดไม่สำเร็จ';
      }else{
        toast(e.message);
      }
    }
  }

  function normalizeProducts(list){
    return (list || []).map((p,i) => {
      const id = String(p.id || p.productId || p.productID || p.code || p.sku || ('P' + i));
      const price = Number(p.price || p.salePrice || p.normalPrice || 0);
      const qty = Number(p.quantity || p.qty || p.stock || 0);

      return {
        ...p,
        id,
        name:String(p.name || p.productName || p.title || ''),
        detail:String(p.detail || p.description || p.desc || ''),
        imageUrl:String(p.imageUrl || p.image || p.img || p.picture || ''),
        price,
        priceText:p.priceText || ('฿' + money(price)),
        quantity:qty,
        saleOpenNow:p.saleOpenNow !== false && p.saleOpen !== false && p.status !== 'ปิดขาย',
        hasOptions:!!(p.hasOptions || p.optionsCount || p.optionCount),
        promoEligible:!!(p.promoEligible || p.promo || p.isPromo)
      };
    });
  }

  function updateStats(){
    const ready = products.filter(p => Number(p.quantity || 0) > 0 && p.saleOpenNow !== false).length;

    $('statProducts').textContent = products.length;
    $('statReady').textContent = ready;
  }

  function scrollToProducts(){
    $('productsSection').scrollIntoView({behavior:'smooth',block:'start'});
  }

  function handleSearch(){
    $('clearSearch').style.display = $('searchInput').value.trim() ? 'block' : 'none';
    renderProducts();
  }

  function clearSearch(){
    $('searchInput').value = '';
    $('clearSearch').style.display = 'none';
    renderProducts();
  }

  function setFilter(filter,btn){
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    renderProducts();
  }

  function filteredProducts(){
    const q = $('searchInput').value.trim().toLowerCase();
    let list = products.slice();

    if (q){
      list = list.filter(p =>
        String(p.name || '').toLowerCase().includes(q) ||
        String(p.detail || '').toLowerCase().includes(q) ||
        String(p.id || '').toLowerCase().includes(q)
      );
    }

    if (currentFilter === 'ready'){
      list = list.filter(p => Number(p.quantity || 0) > 0 && p.saleOpenNow !== false);
    }

    if (currentFilter === 'promo'){
      list = list.filter(p => p.promoEligible);
    }

    if (currentFilter === 'option'){
      list = list.filter(p => p.hasOptions);
    }

    return list;
  }

  function renderProducts(){
    const list = filteredProducts();

    $('resultCount').textContent = list.length + ' รายการ';

    if (!list.length){
      $('productGrid').innerHTML = `
        <div class="empty">
          ไม่พบสินค้า<br>
          ลองค้นหาด้วยคำอื่น หรือเลือกหมวดทั้งหมด
        </div>
      `;
      return;
    }

    $('productGrid').innerHTML = list.map((p,index) => {
      const qty = Number(p.quantity || 0);
      const disabled = !p.saleOpenNow || qty <= 0;
      const badge = p.hasOptions ? 'OPTIONS' : (p.promoEligible ? 'PROMO' : 'READY');

      return `
        <article class="card" style="animation-delay:${Math.min(index * .025,.24)}s">
          <div class="productImage">
            <span class="tag">${escapeHtml(badge)}</span>
            <img loading="lazy"
              src="${escapeAttr(p.imageUrl || '')}"
              onerror="this.src='https://placehold.co/420x420/F4EFE6/111111?text=426+SHOP'">
          </div>

          <div class="productName">${escapeHtml(p.name)}</div>
          <div class="productDesc">${escapeHtml(p.detail || 'เลือกสินค้าเพื่อสั่งซื้อ')}</div>
          <div class="price">${escapeHtml(p.priceText || ('฿' + money(p.price)))}</div>

          <div class="stock">
            <i class="${disabled ? 'out' : ''}"></i>
            <span>${disabled ? 'สินค้าหมดหรือปิดขาย' : 'คงเหลือ ' + qty}</span>
          </div>

          <button class="buy" ${disabled ? 'disabled' : ''} onclick="selectProduct('${escapeAttr(p.id)}')">
            ${p.hasOptions ? 'เลือกตัวเลือก' : 'เพิ่มลงตะกร้า'}
          </button>
        </article>
      `;
    }).join('');
  }

  async function selectProduct(productId){
    const p = products.find(x => String(x.id) === String(productId));

    if (!p) return;

    if (p.hasOptions){
      openOptions(p);
      return;
    }

    addToCart({
      productId:p.id,
      stockProductId:p.id,
      optionId:'',
      name:p.name,
      price:Number(p.price || 0),
      imageUrl:p.imageUrl || '',
      qty:1
    });

    toast('เพิ่มลงตะกร้าแล้ว');
  }

  async function openOptions(product){
    openModal('เลือกตัวเลือก', loadingHtml('กำลังโหลดตัวเลือก...'));

    try{
      const res = await api('options',{productId:product.id});

      if (!res || res.ok === false){
        throw new Error((res && res.message) || 'โหลดตัวเลือกไม่สำเร็จ');
      }

      const options = normalizeOptions(res.options || res.items || [], product);

      if (!options.length){
        $('modalBody').innerHTML = `
          <div class="notice warn">ยังไม่มีตัวเลือกสินค้า</div>
          <button class="bigBtn light" onclick="closeModal()">ปิด</button>
        `;
        return;
      }

      $('modalBody').innerHTML = `
        <div class="notice">
          <b>${escapeHtml(product.name)}</b><br>
          เลือกตัวเลือกที่ต้องการ
        </div>

        ${options.map(o => {
          const disabled = Number(o.quantity || 0) <= 0;
          const item = {
            productId:product.id,
            optionId:o.optionId,
            stockProductId:o.stockProductId,
            name:product.name + ' - ' + o.name,
            price:Number(o.price || 0),
            imageUrl:o.imageUrl || product.imageUrl || '',
            qty:1
          };

          return `
            <div class="row">
              <div class="rowTop">
                <div>
                  <div class="rowName">${escapeHtml(o.name)}</div>
                  <div class="rowMeta">${escapeHtml(o.detail || '')}</div>
                  <div class="rowMeta">${disabled ? 'คงเหลือ 0' : 'คงเหลือ ' + Number(o.quantity || 0)}</div>
                </div>
                <b>฿${money(o.price)}</b>
              </div>

              <button class="bigBtn ${disabled ? 'light' : 'gold'}"
                ${disabled ? 'disabled' : ''}
                onclick='addOption(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
                ${disabled ? 'สินค้าหมด' : 'เพิ่มลงตะกร้า'}
              </button>
            </div>
          `;
        }).join('')}
      `;

    }catch(e){
      $('modalBody').innerHTML = `
        <div class="notice warn">${escapeHtml(e.message)}</div>
        <button class="bigBtn light" onclick="closeModal()">ปิด</button>
      `;
    }
  }

  function normalizeOptions(list, product){
    return (list || []).map((o,i) => {
      const price = Number(o.price || o.salePrice || product.price || 0);
      const qty = Number(o.quantity || o.qty || o.stock || 0);

      return {
        ...o,
        optionId:String(o.optionId || o.id || o.optionCode || ('O' + i)),
        stockProductId:String(o.stockProductId || o.productId || product.id),
        name:String(o.name || o.optionName || o.title || ''),
        detail:String(o.detail || o.description || ''),
        imageUrl:String(o.imageUrl || o.image || product.imageUrl || ''),
        price,
        quantity:qty
      };
    });
  }

  function addOption(item){
    addToCart(item);
    toast('เพิ่มลงตะกร้าแล้ว');
    openCart();
  }

  function addToCart(item){
    const key = String(item.optionId || item.stockProductId || item.productId);
    const found = cart.find(x => String(x.optionId || x.stockProductId || x.productId) === key);

    if (found){
      found.qty = Number(found.qty || 0) + 1;
    }else{
      cart.push(item);
    }

    saveCart();
  }

  function openCart(){
    openModal('ตะกร้าสินค้า', cartHtml());
  }

  function cartHtml(){
    if (!cart.length){
      return `
        <div class="notice">
          ยังไม่มีสินค้าในตะกร้า<br>
          เลือกสินค้าที่ต้องการ แล้วกดชำระเงิน
        </div>
        <button class="bigBtn light" onclick="closeModal()">เลือกสินค้า</button>
      `;
    }

    return `
      ${cart.map((item,i) => `
        <div class="row">
          <div class="rowTop">
            <div>
              <div class="rowName">${escapeHtml(item.name)}</div>
              <div class="rowMeta">฿${money(item.price)} / ชิ้น</div>
            </div>
            <b>฿${money(Number(item.price || 0) * Number(item.qty || 0))}</b>
          </div>

          <div class="qty">
            <button onclick="changeQty(${i},-1)">−</button>
            <b>${Number(item.qty || 0)}</b>
            <button onclick="changeQty(${i},1)">+</button>
            <button class="remove" onclick="removeItem(${i})">ลบ</button>
          </div>
        </div>
      `).join('')}

      <div class="total">รวม ฿${money(cartTotal())}</div>
      <button class="bigBtn gold" onclick="checkout()">สร้างออเดอร์</button>
      <button class="bigBtn danger" onclick="clearCart()">ล้างตะกร้า</button>
    `;
  }

  function cartTotal(){
    return cart.reduce((s,x) => s + Number(x.price || 0) * Number(x.qty || 0), 0);
  }

  function changeQty(i,d){
    cart[i].qty = Number(cart[i].qty || 0) + d;

    if (cart[i].qty <= 0){
      cart.splice(i,1);
    }

    saveCart();
    $('modalBody').innerHTML = cartHtml();
  }

  function removeItem(i){
    cart.splice(i,1);
    saveCart();
    $('modalBody').innerHTML = cartHtml();
  }

  function clearCart(){
    cart = [];
    saveCart();
    $('modalBody').innerHTML = cartHtml();
  }

  async function checkout(){
    if (!cart.length){
      openCart();
      return;
    }

    openModal('สร้างออเดอร์', loadingHtml('กำลังสร้างออเดอร์...'));

    const payload = {
      channel:'WEB',
      sessionId:sessionId(),
      customerName:'ลูกค้าเว็บ',
      phone:'',
      email:'',
      cart:cart.map(x => ({
        productId:x.productId || '',
        optionId:x.optionId || '',
        stockProductId:x.stockProductId || '',
        qty:Number(x.qty || 1)
      }))
    };

    try{
      const res = await api('checkout',{
        payload:encodeURIComponent(JSON.stringify(payload))
      });

      if (!res || res.ok === false){
        throw new Error((res && res.message) || 'สร้างออเดอร์ไม่สำเร็จ');
      }

      const orderId = res.orderId || res.orderNo || res.id || '';
      const auth = res.auth || res.token || res.receiveCode || '';

      saveLastOrder({orderId,auth});

      cart = [];
      saveCart();

      renderPayment(res, orderId, auth);

    }catch(e){
      $('modalBody').innerHTML = `
        <div class="notice warn">${escapeHtml(e.message)}</div>
        <button class="bigBtn light" onclick="openCart()">กลับไปตะกร้า</button>
      `;
    }
  }

  function renderPayment(res, orderId, auth){
    const bank = res.bank || bankCache || {};
    const totalText = res.totalText || ('฿' + money(res.total || res.amount || 0));

    $('modalTitle').textContent = 'ชำระเงิน';

    $('modalBody').innerHTML = `
      <div class="notice good">
        สร้างออเดอร์สำเร็จ<br>
        Order ID: <b>${escapeHtml(orderId)}</b>
      </div>

      <div class="total">${escapeHtml(totalText)}</div>

      <div class="row">
        <div class="rowName">บัญชีสำหรับโอนเงิน</div>
        <div class="rowMeta">${escapeHtml(bank.bankName || bank.name || '')}</div>
        <div class="rowMeta">${escapeHtml(bank.bankAccountName || bank.accountName || '')}</div>

        <div style="font-size:24px;font-weight:1000;color:#111;margin-top:9px;letter-spacing:.2px">
          ${escapeHtml(bank.bankAccountFormatted || bank.bankAccountNumber || bank.account || '')}
        </div>

        <button class="bigBtn gold" onclick="copyText('${escapeAttr(bank.bankAccountNumber || bank.account || '')}')">
          คัดลอกเลขบัญชี
        </button>
      </div>

      <div class="notice warn">
        หลังโอนเงินแล้ว ให้แอดมินยืนยันชำระเงินในชีต จากนั้นกดรับสินค้า
      </div>

      <button class="bigBtn" onclick="receiveOrder('${escapeAttr(orderId)}','${escapeAttr(auth)}')">รับสินค้า</button>
      <button class="bigBtn light" onclick="copyText('${escapeAttr(orderId + '|' + auth)}')">คัดลอกข้อมูลออเดอร์</button>
    `;
  }

  function openReceive(){
    openModal('รับสินค้า', `
      <div class="notice">
        ถ้าสั่งซื้อจากเครื่องนี้ ระบบจะจำออเดอร์ล่าสุดไว้ให้<br>
        หรือกรอก Order ID และรหัสรับสินค้าเองได้
      </div>

      <div class="form">
        <input id="lookupOrderId" placeholder="Order ID" value="${escapeAttr(lastOrder.orderId || '')}">
        <input id="lookupAuth" placeholder="รหัสรับสินค้า" value="${escapeAttr(lastOrder.auth || '')}">
      </div>

      <button class="bigBtn gold" onclick="receiveByInput()">รับสินค้า</button>
      <button class="bigBtn light" onclick="checkOrderByInput()">เช็กสถานะ</button>
    `);
  }

  function receiveByInput(){
    const orderId = $('lookupOrderId').value.trim();
    const auth = $('lookupAuth').value.trim();

    if (!orderId || !auth){
      toast('กรุณากรอกข้อมูลให้ครบ');
      return;
    }

    receiveOrder(orderId,auth);
  }

  async function checkOrderByInput(){
    const orderId = $('lookupOrderId').value.trim();
    const auth = $('lookupAuth').value.trim();

    if (!orderId || !auth){
      toast('กรุณากรอกข้อมูลให้ครบ');
      return;
    }

    openModal('เช็กสถานะ', loadingHtml('กำลังเช็กสถานะ...'));

    try{
      const res = await api('order',{orderId,auth});

      if (!res || res.ok === false){
        throw new Error((res && res.message) || 'เช็กสถานะไม่สำเร็จ');
      }

      $('modalBody').innerHTML = `
        <div class="notice">
          Order ID: <b>${escapeHtml(res.orderId || orderId)}</b><br>
          สถานะออเดอร์: <b>${escapeHtml(res.orderStatus || res.status || '')}</b><br>
          สถานะชำระเงิน: <b>${escapeHtml(res.paymentStatus || '')}</b><br>
          ยอดรวม: <b>${escapeHtml(res.totalText || '')}</b>
        </div>

        <button class="bigBtn gold" onclick="receiveOrder('${escapeAttr(orderId)}','${escapeAttr(auth)}')">รับสินค้า</button>
        <button class="bigBtn light" onclick="openReceive()">กลับ</button>
      `;

    }catch(e){
      $('modalBody').innerHTML = `
        <div class="notice warn">${escapeHtml(e.message)}</div>
        <button class="bigBtn light" onclick="openReceive()">กลับ</button>
      `;
    }
  }

  async function receiveOrder(orderId,auth){
    if (!orderId || !auth){
      openReceive();
      return;
    }

    openModal('รับสินค้า', loadingHtml('กำลังจัดส่งสินค้า...'));

    try{
      const res = await api('receive',{orderId,auth});

      if (!res || res.ok === false){
        $('modalBody').innerHTML = `
          <div class="notice warn">${escapeHtml((res && res.message) || 'ยังรับสินค้าไม่ได้')}</div>
          <button class="bigBtn light" onclick="openReceive()">กลับไปเช็กอีกครั้ง</button>
        `;
        return;
      }

      const items = res.items || res.codes || [];

      $('modalTitle').textContent = 'สินค้าของคุณ';

      $('modalBody').innerHTML = `
        <div class="notice good">
          ${escapeHtml(res.message || 'รับสินค้าเรียบร้อย')}<br>
          Order ID: <b>${escapeHtml(res.orderId || orderId)}</b>
        </div>

        ${
          items.length
          ? items.map((it,i) => `
            <div class="row">
              <div class="rowName">${escapeHtml(it.name || it.productName || ('สินค้า ' + (i + 1)))}</div>
              <div class="codeBox" id="code_${i}">${escapeHtml(it.code || it.value || it.text || '')}</div>
              <button class="bigBtn gold" onclick="copyFromBox('code_${i}')">คัดลอกสินค้า</button>
            </div>
          `).join('')
          : `<div class="notice warn">ไม่พบรายการสินค้าในออเดอร์นี้</div>`
        }

        ${items.length ? `<button class="bigBtn light" onclick="copyAllItems()">คัดลอกทั้งหมด</button>` : ''}
      `;

    }catch(e){
      $('modalBody').innerHTML = `
        <div class="notice warn">${escapeHtml(e.message)}</div>
        <button class="bigBtn light" onclick="openReceive()">กลับ</button>
      `;
    }
  }

  function copyAllItems(){
    const text = Array.from(document.querySelectorAll('.codeBox'))
      .map(x => x.textContent.trim())
      .filter(Boolean)
      .join('\n\n');

    copyText(text);
  }

  function copyFromBox(id){
    copyText($(id).textContent);
  }

  function copyText(text){
    text = String(text || '').trim();

    if (!text){
      toast('ไม่มีข้อมูลให้คัดลอก');
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('คัดลอกแล้ว'));
      return;
    }

    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();

    toast('คัดลอกแล้ว');
  }

  function openModal(title,html){
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = html;
    $('modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    $('modal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function backdropClose(e){
    if (e.target.id === 'modal') closeModal();
  }

  function loadingHtml(text){
    return `
      <div class="loading">
        <div class="spinner"></div>
        ${escapeHtml(text || 'กำลังโหลด...')}
      </div>
    `;
  }

  function toast(msg){
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');

    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.remove('show'),1700);
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g,m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m]));
  }

  function escapeAttr(s){
    return escapeHtml(s).replace(/`/g,'&#96;');
  }

  document.addEventListener('keydown',e => {
    if (e.key === 'Escape') closeModal();
  });

  loadCatalog();
</script>
</body>
</html>
